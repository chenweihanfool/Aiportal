# Replicates the Replit path-based router: /api/* goes to the api-server
# container, everything else serves the static SPA build with a fallback to
# index.html so client-side routing (if any is added later) keeps working.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 傳輸壓縮：JS bundle 約 420 KB，未壓縮時在行動網路上是主要等待時間。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # 前面有 Caddy 反向代理（它會加 Via 標頭）；nginx 預設 gzip_proxied off 會對「來自代理」的請求略過壓縮，
    # 等於真實流量一律不壓縮。any＝不論有無 Via／Authorization 等標頭都壓縮。
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 帶雜湊檔名的建置產物（Vite 輸出到 assets/）：內容改變檔名就會變，可長期快取；
    # 找不到就 404，不要退回 index.html（否則舊頁面引用已不存在的 chunk 時會把 HTML 當 JS 執行）。
    location ~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口頁每次都要重新驗證，部署後才會立刻拿到指向新雜湊檔名的版本。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
