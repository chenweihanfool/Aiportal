services:
  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      VIKUNJA_API_BASE_URL: ${VIKUNJA_API_BASE_URL}
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN}
      ADVENTURELOG_API_BASE_URL: ${ADVENTURELOG_API_BASE_URL}
      ADVENTURELOG_API_TOKEN: ${ADVENTURELOG_API_TOKEN}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      # 摘要來源網址：程式碼以 `??` 取預設值，空字串不會 fallback，所以這裡必須用 `:-` 帶出同一組預設值，
      # 而不是 `${VAR}`（未設會展開成空字串）。要改指向其他主機時在 .env 設定即可。
      PF_CWH_SUMMARY_URL: ${PF_CWH_SUMMARY_URL:-https://cwh2023.synology.me/pf/api/public/summary}
      FITNESSFORGE_SUMMARY_URL: ${FITNESSFORGE_SUMMARY_URL:-https://cwh2023.synology.me/fitness/api/public/summary}
      # 附件預覽（GET /api/hermes-attachment）讀這個資料夾；唯讀掛載，api-server 無法寫入或改動 vault。
      HERMES_ATTACHMENT_ROOT: /data/attachments
    volumes:
      # 在主機 .env 設 ATTACHMENTS_DIR=<vault 的「附件」資料夾>（例如 /srv/obsidian/vault/附件）。
      # 未設時掛本專案內一個空的 ./attachments（API 回「找不到」，不影響其他功能），不會誤掛到別處。
      - ${ATTACHMENTS_DIR:-./attachments}:/data/attachments:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      # Uncomment and set to whatever network the shared self-hosted Postgres
      # instance lives on, if it's a container on this same Docker host
      # (matches the pf-cwh / tasktracker setup):
      # - shared_postgres

  # One-off schema sync — deliberately NOT part of `docker compose up`.
  # Uses the api-server Dockerfile's intermediate `build` stage (full pnpm
  # workspace incl. drizzle-kit), not the slim `runtime` stage, since the
  # runtime image has no node_modules. Run explicitly on every deploy:
  #   docker compose --profile migrate run --build --rm db-migrate
  #
  # The --build is not optional/cosmetic: `docker compose run` (unlike `up`)
  # does NOT rebuild a service whose image already exists, even if the repo
  # (and therefore lib/db/migrations/) has moved on since that image was
  # built. Without --build this silently runs migrate.mjs against whatever
  # migration files happened to be baked into the last-built image, reports
  # "already up to date" using a stale view of what migrations exist, and
  # the new table/column just never appears — confirmed hitting exactly
  # this on 2026-08-09 (mind_index_history) before adding --build here.
  #
  # Applies versioned SQL files from lib/db/migrations/ (generate them with
  # `pnpm --filter @workspace/db run generate` after changing schema.ts,
  # commit them, then this runs on deploy) instead of `drizzle-kit push`'s
  # live schema diffing. Switched away from push because it kept proposing
  # to DROP+recreate busyness_index_history / happiness_index_history (the
  # only two tables with a text[] column) even when the declared schema
  # exactly matched the live DB — a drizzle-kit push limitation with
  # Postgres array-column diffing, not a schema mistake. generate+migrate
  # sidesteps live diffing entirely: each migration is exact, reviewed SQL,
  # and re-running an already-applied migration is a safe no-op, so there's
  # no more data-loss prompt to babysit on every deploy.
  db-migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      target: build
    working_dir: /repo
    entrypoint: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - default
      # - shared_postgres

  gis-portal:
    build:
      context: .
      dockerfile: artifacts/gis-portal/Dockerfile
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      - "${HOST_PORT:-3000}:80"
    networks:
      - default

networks:
  default: {}
  # shared_postgres:
  #   external: true
  #   name: <the actual external network name used by pf-cwh / tasktracker>
